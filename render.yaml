services:
  - type: web
    name: clausewise-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: standard
    healthCheckPath: /api/v1/health
    disk:
      name: clausewise-data
      mountPath: /app/uploads
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clausewise-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: clausewise-frontend
          property: host
      - key: ALLOWED_ORIGINS
        value: https://clausewise-frontend.onrender.com,http://localhost:3000
      - key: AI_PROVIDER
        value: xai
      - key: AI_BASE_URL
        value: https://api.x.ai/v1
      - key: AI_MODEL
        value: grok-2-latest
      - key: AI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_OCR
        value: "true"
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_AGENT_ROUNDS
        value: "6"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"

  - type: web
    name: clausewise-frontend
    runtime: node
    plan: standard
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: clausewise-backend
          property: host
      - key: NODE_ENV
        value: production

databases:
  - name: clausewise-db
    plan: standard
    databaseName: clausewise
    user: clausewise_user
